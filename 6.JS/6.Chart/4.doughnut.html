<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Document</title>
        <!-- 1. Chart.js 로드 -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>
    <body>
        <!-- 2. canvas 준비 -->
        <canvas id="myChart"></canvas>

        <script>
            // 3. 데이터 준비
            const data = {
                labels: ['Red', 'Blue', 'Yellow'],
                datasets: [
                    {
                        label: 'My First DataSet',
                        data: [300, 50, 100],
                        backgroundColor: [
                            'rgb(255,99,132)',
                            'rgb(54,162,253)',
                            'rgb(255,205,86)',
                        ],
                        hoverOffset: 4,
                    },
                ],
            };

            // 4. 설정
            const config = {
                type: 'doughnut',
                data: data,
            };

            // 5️. 차트 생성
            const ctx = document.getElementById('myChart');
            new Chart(ctx, config);
        </script>
    </body>
</html>
