    <body>

        <h1>랜덤 사진 표시</h1>
        <input type="number" name="dog" />
        <button id="photoBtn">강아지 요청</button>
        <div id="result"></div>
        <script>
            document
                .getElementById('photoBtn')
                .addEventListener('click', () => {
                    fetch('요청할 주소')
                    .then(resp => resp.json()).then(data =>{
                        displayResult(data);
                    })
                });
        </script>
    </body>
