<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>Document</title>
        <style>
            canvas {
                border: 1px solid black;
            }
        </style>
    </head>
    <body>
        <canvas id="myCanvas" width="400" height="300"></canvas>
        <script>
            const canvas = document.getElementById('myCanvas');
            const context = canvas.getContext('2d');

            // 1. 사각형 그리기
            context.fillStyle = '#FF0000';
            context.fillRect(50, 50, 200, 100); // (x, y, width, height)

            context.fillStyle = '#0000FF';
            context.fillRect(50, 150, 200, 100);

            // 2. 라인 그리기
            context.strokeStyle = '#00FF00';
            context.lineWidth = 2;
            context.beginPath();
            context.moveTo(150, 50); // 첫번째 좌표
            context.lineTo(50, 150); // 시작점부터 여기까지 선을 그려라..

            context.moveTo(250, 150); // 2번째 좌표
            context.lineTo(150, 50); // 시작점부터 여기까지 선을 그려라..

            context.moveTo(50, 150); // 3번째 좌표
            context.lineTo(150, 250); // 시작점부터 여기까지 선을 그려라..

            context.moveTo(250, 150); // 4번째 좌표
            context.lineTo(150, 250); // 시작점부터 여기까지 선을 그려라..

            context.stroke(); // 실제로 그리기..
            context.closePath();

            // 3. 원 그리기
            context.fillStyle = '#FFFF00';
            context.beginPath();
            context.arc(350, 50, 30, 0, 2 * Math.PI);
            context.fill();
            context.closePath();

            context.fillStyle = '#000000';
            context.beginPath();
            context.arc(350, 150, 30, (1 / 2) * Math.PI, (3 / 2) * Math.PI);
            context.fill();
            context.closePath();

            // 0 라디언은 오른쪽에서 출발하고
            // 1/2 파이 라디언은 90도
            // 파이 라이언은 180도
            // 3/2 파이 라디언은 270도
            // 2파이 라이언은 360도
        </script>
    </body>
</html>
