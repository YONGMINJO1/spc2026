<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>Document</title>
        <style>
            canvas {
                border: 1px solid black;
            }
        </style>
    </head>
    <body>
        <canvas id="myCanvas" width="400" height="200"></canvas>

        <script>
            const canvas = document.getElementById('myCanvas');
            const context = canvas.getContext('2d');

            const ball = {
                x: 50,
                y: 50,
                radius: 10,
                speed: 1,
                vx: 1,
                vy: 1,

                draw() {
                    context.clearRect(0, 0, canvas.width, canvas.height);
                    context.beginPath();
                    context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    context.fillStyle = 'red';
                    context.fill();
                    context.closePath();
                },
                checkBoundary(position, speed, max) {
                    if (
                        position > max - this.radius ||
                        position < this.radius
                    ) {
                        return -speed;
                    }
                    return speed;
                },
                update() {
                    this.x += this.vx;
                    this.y += this.vy;

                    this.vx = this.checkBoundary(this.x, this.vx, canvas.width);
                    this.vy = this.checkBoundary(
                        this.y,
                        this.vy,
                        canvas.height,
                    );

                    // // x가 350(캔버스 넓이 - 볼의 반지름) 보다 크면 방향을 바꾼다.
                    // if (this.x > canvas.width - this.radius) {
                    //     this.speedx = -this.speed;
                    // }
                    // // y가 150 (캔버스 높이 - 볼의 반지름) 보다 크면 방향을 바꾼다.
                    // if (this.y > canvas.height - this.radius) {
                    //     this.speedy = -this.speed;
                    // }
                    // // 반지름 보다 작아야 캔버스 안에 들어옴 (중심기준)
                    // if (this.x < 0 + this.radius) {
                    //     this.speedx = +this.speed;
                    // }
                    // // 반지름 보다 작아야 캔버스 안에 들어옴 (중심기준)
                    // if (this.y < 0 + this.radius) {
                    //     this.speedy = +this.speed;
                    // }
                },
            };

            function loop() {
                ball.update();
                ball.draw();
                requestAnimationFrame(loop);
            }
            loop();
