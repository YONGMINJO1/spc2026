<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>Todo List</title>
        <style>
            .done {
                text-decoration: line-through;
            }

            #todo-list li {
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <h1>오늘 할일 (Todo 리스트)</h1>
        <input type="text" id="new-todo" placeholder="할일 입력" />
        <button id="add-todo">추가</button>
        <ul id="todo-list">
            <!-- 할일 표시할 곳 -->
        </ul>
        <script>
            // 1단계: 추가 구현
            // 1. 버튼이 클릭되면...
            // 2. 거기 값 읽어와서.. ul아래 li 추가하기...

            // 버튼을 누르면 -> input 값을 읽어서 -> li로 추가한다.
            // 요소 가져오기
            //const input = document.getElementById('new-todo');

            // 이벤트 → 값 → 생성 → 넣기 → 추가
            document
                .getElementById('add-todo')
                .addEventListener('click', () => {
                    const newTodo = document.getElementById('new-todo').value;

                    if (newTodo.trim() === '') return;

                    const new_li = document.createElement('li');

                    new_li.textContent = newTodo;

                    // 클릭 이벤트를 나의 li에 걸리
                    new_li.addEventListener('click', () => {
                        // if (new_li.classList.contains('done')) {
                        //     new_li.classList.remove('done');
                        // } else {
                        //     new_li.classList.add('done');
                        // }
                        new_li.classList.add('done');
                    });
                    const todoList = document.getElementById('todo-list');
                    todoList.appendChild(new_li);

                    // 입력 후 창 클리어
                    document.getElementById('new-todo').value = '';
                });

            //기능 개선 - 엔터
            document
                .getElementById('new-todo')
                .addEventListener('keydown', (ev) => {
                    if (ev.key === 'Enter')
                        document.getElementById('add-todo').click(); // 버튼을 클릭한 액션을 대신 수행
                });

            //     li.textContent = value;
            //     list.appendChild(li);
            //     input.value = '';

            // 2단계: 완료(done) 구현
            // 1. li를 클릭해서 완료상태 표시 (css로 strike라인 추가)
