<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>Document</title>
        <style>
            body {
                margin: 0;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background: #f5f6f8;
                font-family: Arial, Helvetica, sans-serif;
            }

            .stopwatch-box {
                background: white;
                padding: 40px 50px;
                border-radius: 16px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
                text-align: center;
            }

            #display {
                font-size: 48px;
                font-weight: bold;
                margin-bottom: 25px;
                letter-spacing: 2px;
            }

            #button-center {
                display: flex;
                gap: 10px;
                justify-content: center;
            }

            button {
                padding: 10px 18px;
                font-size: 14px;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                transition: 0.2s;
            }

            #startButton {
                background: #4caf50;
                color: white;
            }

            #stopButton {
                background: #f44336;
                color: white;
            }

            #resetButton {
                background: #607d8b;
                color: white;
            }

            button:hover {
                opacity: 0.85;
            }

            button:active {
                transform: scale(0.97);
            }
        </style>
    </head>
    <body>
        <!-- 스톱워치 전체 -->
        <div class="stopwatch-box">
            <div id="display">00:00:00</div>
            <div id="button-center">
                <button id="startButton">Start</button>
                <button id="stopButton">Stop</button>
                <button id="resetButton">Reset</button>
            </div>
        </div>

        <script>
            //DOM 에서 요소를 가져온다
            const display = document.getElementById('display');
            const startButton = document.getElementById('startButton');
            const stopButton = document.getElementById('stopButton');
            const resetButton = document.getElementById('resetButton');

            let startTime; // 스톱워치 시작 시간
            let difference = 0; // 경과 시간
            let running = false; // 현재 타이머 상태
            let updatedTime; // 업데이트 된 시간
            let timerInterval; // 타이머 인터벌

            function startTimer() {
                if (running) return;

                running = true;
                startTime = new Date().getTime(); //시간을 담는 재료를 찾아보기
                timerInterval = setInterval(updateTimer, 10);
            }
            function stopTimer() {
                if (!running) return;

                running = false;
                clearInterval(timerInterval);
            }

            function resetTimer() {
                running = false;
                clearInterval(timerInterval);

                difference = 0;
                display.textContent = '00:00:00';
            }

            function updateTimer() {
                updatedTime = new Date().getTime();
                difference = updatedTime - startTime;

                let minutes = Math.floor(
                    (difference % (1000 * 60 * 60)) / (1000 * 60),
                ); //흘러간 ms 에서 분 계산
                let seconds = Math.floor((difference % (1000 * 60)) / 1000); // 거기에서 초 계산
                let milliseconds = Math.floor((difference % 1000) / 10); // 나머지 ms 계산

                display.textContent =
                    (minutes < 10 ? '0' + minutes : minutes) +
                    ':' +
                    (seconds < 10 ? '0' + seconds : seconds) +
                    '.' +
                    (milliseconds < 10 ? '0' + milliseconds : milliseconds);
            }

            startButton.addEventListener('click', startTimer);
            stopButton.addEventListener('click', stopTimer);
            resetButton.addEventListener('click', resetTimer);
        </script>
    </body>
</html>
