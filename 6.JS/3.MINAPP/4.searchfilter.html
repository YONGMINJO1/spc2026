<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            input {
                padding: 10px;
                font-size: 16px;
            }
            ul {
                list-style: none;
                padding: 0;
            }
            li {
                padding: 10px;
                font-size: 10px;
            }
        </style>
    </head>
    <body>
        <h1>실시간 검색 필터</h1>
        <input type="text" id="searchInput" placeholder="검색어..." />
        <ul id="itemsList">
            <li>apple</li>
            <li>banana</li>
            <li>orange</li>
            <li>grape</li>
            <li>peach</li>
            <li>pear</li>
            <li>cherry</li>
            <li>strawberry</li>
            <li>blueberry</li>
            <li>watermelon</li>
            <li>melon</li>
            <li>pineapple</li>
            <li>mango</li>
            <li>kiwi</li>
            <li>lemon</li>
            <li>lime</li>
            <li>plum</li>
            <li>apricot</li>
            <li>coconut</li>
            <li>pomegranate</li>
        </ul>

        <script>
            //요소를 가져옴
            const searchInput = document.getElementById('searchInput');
            const itemsList = document.getElementById('itemsList');
            const items = itemsList.getElementsByTagName('li'); // html컬렉션 - forEach xx

            searchInput.addEventListener('keyup', () => {
                const filter = searchInput.value.toLowerCase(); // 대소구분 없이

                /* 레거시 for loop*/
                // for (let i = 0; i < items.length; i++) {
                //     const item = items[i];
                //     const text = item.textContent || item.innerText;
                //     if (text.toLowerCase().includes(filter)) {
                //         item.style.display = '';
                //     } else {
                //         item.style.display = 'none';
                //     }
                // }

                Array.from(items).forEach((item) => {
                    const text = item.textContent;
                    if (text.toLowerCase().includes(filter)) {
                        item.style.display = '';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        </script>
    </body>
</html>
