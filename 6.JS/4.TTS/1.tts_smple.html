<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>Document</title>
    </head>
    <body>
        <h1>TTS 예제</h1>
        <textarea id="text" rows="4" cols="50">안녕. 이건 한글이야</textarea
        ><br />
        <button onclick="speak()">읽어주기</button>

        <script>
            function speak() {
                const text = document.getElementById('text').value;
                const speech = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(speech);
            }
        </script>
    </body>
</html>
