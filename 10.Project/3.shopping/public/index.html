<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SPC 쇼핑몰</title>
    </head>
    <body>
        <h1>상품 리뷰</h1>

        <div class="product-image">
            <img src="https://picsum.photos/600/400" />
        </div>

        <!-- 리뷰 작성 폼-->
        <section class="review-form">
            <h2>후기를 남겨주세요</h2>
            <div>
                <p>평점:</p>
                <label><input type="radio" name="rating" value="1" />1</label>
                <label><input type="radio" name="rating" value="2" />2</label>
                <label><input type="radio" name="rating" value="3" />3</label>
                <label><input type="radio" name="rating" value="4" />4</label>
                <label><input type="radio" name="rating" value="5" />5</label>
            </div>

            <textarea
                id="comment"
                placeholder="후기를 작성해주세요..."
                rows="5"
                cols="40"
            ></textarea>
            <button id="send">제출</button>

            <section>
                <h2>리뷰</h2>
                <div class="ai-summary">
                    <p><strong>AI 요약:</strong>현재는 리뷰가 없습니다.</p>
                    <p><strong>평균 별점:</strong>N/A</p>
                </div>
                <div id="review-container"></div>
            </section>
        </section>
        <script>
            async function loadAiSummary() {
                const response = await fetch('/api/ai-summary'); // GET 요청
                const data = await response.json(); // JSON → JS 객체

                const summaryDiv = document.querySelector('.ai-summary');
                summaryDiv.innerHTML = `
        <p><strong>AI 요약:</strong> ${data.message}</p>
    `;
            }

            async function loadReviews() {
                const response = await fetch('/api/reviews'); // GET 요청
                const reviews = await response.json(); // JSON → JS 배열

                const container = document.getElementById('review-container');
                container.innerHTML = ''; // 기존 내용 초기화

                reviews.forEach((review) => {
                    container.innerHTML += `
                        <div>
                            <p>Rating: ${review.rating}</p>
                            <p>${review.comment}</p>
                        </div>
                    `;
                });
            }

            document
                .getElementById('send')
                .addEventListener('click', async () => {
                    const rating = document.querySelector(
                        'input[name="rating"]:checked',
                    ).value;
                    const comment = document.getElementById('comment').value;
                    await fetch('/api/reviews', {
                        method: 'POST',
                        headers: {
                            'Content-type': 'application/json',
                        },
                        body: JSON.stringify({
                            rating: rating,
                            comment: comment,
                        }),
                    });
                    await loadReviews();
                    await loadAiSummary();
                });
            loadReviews();
            loadAiSummary();
        </script>
    </body>
</html>
